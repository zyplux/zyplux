packages:
  - 'packages/*'
  - 'apps/*'
  - 'tests/*'

catalog:
  '@happy-dom/global-registrator': ^21.0.4
  mermaid: ^12.2.0
  '@eslint/js': '^10.0.1'
  '@eslint-react/eslint-plugin': ^5.28.4
  '@optique/core': ^1.3.6
  '@optique/run': ^1.3.6
  '@types/node': ^26.6.5
  '@typescript-eslint/type-utils': ^8.72.0
  '@typescript-eslint/utils': ^8.72.0
  '@vitest/coverage-istanbul': ^5.0.5
  '@vitest/eslint-plugin': '^1.6.27'
  eslint: ^10.13.0
  eslint-config-prettier: '^10.1.8'
  eslint-plugin-perfectionist: ^5.13.0
  eslint-plugin-prefer-arrow-functions: '^3.10.2'
  eslint-plugin-unicorn: ^78.0.0
  knip: ^6.42.1
  prettier: ^3.9.10
  smol-toml: ^1.9.1
  typescript: '^6.0.3'
  typescript-eslint: ^8.72.0
  vitest: ^5.0.5
  yaml: ^2.9.1
  zod: ^4.6.7
  publint: ^0.3.25
  commonmark: ^0.31.2
  '@types/commonmark': ^0.27.10
  eslint-plugin-zod: ^5.2.1
  semver: ^7.8.5
  '@types/semver': ^7.8.0

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true

minimumReleaseAgeExclude:
  - '@zyplux/*'

updateConfig:
  ignoreDependencies:
    - typescript

versioning:
  changelog:
    storage: repository

publishWaitTimeout: 600000
