packages:
  - 'packages/*'
  - 'apps/*'
  - 'tests/*'

catalog:
  lefthook: 2.2.2
  '@happy-dom/global-registrator': ^21.0.4
  mermaid: ^12.3.0
  '@eslint/js': '^10.0.1'
  '@eslint-react/eslint-plugin': ^5.30.2
  '@optique/core': ^1.3.6
  '@optique/run': ^1.3.6
  '@types/node': ^26.6.6
  '@typescript-eslint/type-utils': ^8.72.2
  '@typescript-eslint/utils': ^8.72.2
  '@vitest/coverage-istanbul': ^5.1.0
  '@vitest/eslint-plugin': ^1.6.28
  eslint: ^10.14.0
  eslint-config-prettier: '^10.1.8'
  eslint-plugin-perfectionist: ^5.13.0
  eslint-plugin-prefer-arrow-functions: '^3.10.2'
  eslint-plugin-unicorn: ^79.0.0
  knip: ^6.45.1
  prettier: ^3.10.1
  smol-toml: ^1.9.1
  typescript: '^6.0.3'
  typescript-eslint: ^8.72.2
  vitest: ^5.1.0
  yaml: ^2.9.1
  zod: ^4.6.7
  publint: ^0.3.25
  commonmark: ^0.31.2
  '@types/commonmark': ^0.27.10
  eslint-plugin-zod: ^5.2.2
  skills: 1.8.1

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true

minimumReleaseAgeExclude:
  - '@zyplux/*'

updateConfig:
  ignoreDependencies:
    - typescript

versioning:
  changelog:
    storage: repository

publishWaitTimeout: 600000

allowBuilds:
  lefthook: true
