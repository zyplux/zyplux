packages:
  - 'packages/*'
  - 'apps/*'
  - 'tests/*'

catalog:
  '@eslint/js': '^10.0.1'
  '@eslint-react/eslint-plugin': ^5.24.4
  '@optique/core': ^1.3.2
  '@optique/run': ^1.3.2
  '@types/node': ^26.6.4
  '@typescript-eslint/type-utils': ^8.71.1
  '@typescript-eslint/utils': ^8.71.1
  '@vitest/coverage-istanbul': ^5.0.3
  '@vitest/eslint-plugin': '^1.6.27'
  eslint: ^10.12.0
  eslint-config-prettier: '^10.1.8'
  eslint-plugin-perfectionist: ^5.12.1
  eslint-plugin-prefer-arrow-functions: '^3.10.2'
  eslint-plugin-unicorn: ^77.0.0
  knip: ^6.39.0
  prettier: ^3.9.9
  smol-toml: ^1.9.0
  typescript: '^6.0.3'
  typescript-eslint: ^8.71.1
  vitest: ^5.0.3
  yaml: ^2.9.1
  zod: ^4.6.5
  publint: ^0.3.25

minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true

minimumReleaseAgeExclude:
  - '@zyplux/*'

updateConfig:
  ignoreDependencies:
    - typescript
