name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  resolve:
    name: select pending releases
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      npm: ${{ steps.targets.outputs.npm }}
      pypi: ${{ steps.targets.outputs.pypi }}
      ghcr: ${{ steps.targets.outputs.ghcr }}
      action: ${{ steps.targets.outputs.action }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup-pm
      - id: targets
        run: |
          arguments=(--list)
          if [ -n "$RELEASE_TAG" ]; then arguments+=(--tag "$RELEASE_TAG"); fi
          targets="$(pnpm run --silent cz release-bumped-targets "${arguments[@]}")"
          {
            echo "npm=$(jq -c '[.[] | select(.kind == "npm") | .tag]' <<< "$targets")"
            echo "pypi=$(jq -c '[.[] | select(.kind == "pypi") | .tag]' <<< "$targets")"
            echo "ghcr=$(jq -c '[.[] | select(.kind == "ghcr") | .tag]' <<< "$targets")"
            echo "action=$(jq -c '[.[] | select(.kind == "action") | .tag]' <<< "$targets")"
          } >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

  action:
    name: publish ${{ matrix.tag }}
    needs: resolve
    if: needs.resolve.outputs.action != '[]'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.resolve.outputs.action) }}
    concurrency:
      group: release-actions
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup-pm
      - run: pnpm run cz publish-tagged-target --release "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ matrix.tag }}

  npm:
    name: publish ${{ matrix.tag }}
    needs: resolve
    if: needs.resolve.outputs.npm != '[]'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.resolve.outputs.npm) }}
    concurrency:
      group: release-${{ matrix.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup-pm
      - run: pnpm run cz publish-tagged-target --release "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ matrix.tag }}

  pypi:
    name: publish ${{ matrix.tag }}
    needs: resolve
    if: needs.resolve.outputs.pypi != '[]'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.resolve.outputs.pypi) }}
    concurrency:
      group: release-${{ matrix.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup-pm
      - run: pnpm run cz publish-tagged-target --release "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ matrix.tag }}

  ghcr:
    name: publish ${{ matrix.tag }}
    needs: resolve
    if: needs.resolve.outputs.ghcr != '[]'
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.resolve.outputs.ghcr) }}
    concurrency:
      group: release-${{ matrix.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup-pm
      - run: pnpm run cz publish-tagged-target --release "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ matrix.tag }}
