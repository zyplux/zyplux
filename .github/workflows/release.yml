name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to retry (empty selects all pending releases).
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        uses: ./apps/action-airlock
        with:
          command: plan
          tag: ${{ inputs.tag }}

  publish:
    needs: plan
    if: needs.plan.outputs.pending == 'true'
    name: publish ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    environment: ${{ matrix.environment }}
    permissions:
      contents: write
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: airlock-${{ matrix.id }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: ./apps/action-airlock
        with:
          command: publish
          batch: ${{ toJSON(matrix) }}
