name: bootstrap-npm

on:
  workflow_dispatch:
    inputs:
      label:
        description: npm target label to first-publish with a token (e.g. @zyplux/util)
        required: true
        type: string

jobs:
  bootstrap:
    name: bootstrap npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Authenticate to npm
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Bootstrap publish
        run: pnpm run cz bootstrap-npm-target "$LABEL"
        env:
          LABEL: ${{ inputs.label }}
