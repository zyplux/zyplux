name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v9.0.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages --all-groups
      - run: pnpm run knip
      - run: uv run --no-sync vulture
      - run: pnpm run typecheck
      - run: uv run --no-sync rumdl check
      - run: uv run --no-sync rumdl fmt --check
      - run: pnpm run lint
      - run: pnpm run lint:mermaid
      - run: pnpm exec prettier --check .
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pyrefly check
      - run: pnpm run test
      - run: uv run --no-sync pytest
      - run: uv run --no-sync cerberus
