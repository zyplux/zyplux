[project]
name = "zyplux-setup-pm"
version = "1.1.0"
description = "Preflight configuration for the shared package-manager setup action."
requires-python = ">=3.12"

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "setup_pm"
module-root = "src"
