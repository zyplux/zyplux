[project]
name = "zyplux-airlock"
version = "2.0.0"
description = "Prepare and publish reviewed npm, Python, container and GitHub Action releases"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "markdown-it-py>=4.0.0",
    "pydantic>=2.12.0",
    "semantic-version>=2.10.0",
    "typer>=0.27.3",
]

[project.scripts]
airlock = "airlock.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "airlock"
module-root = "src"
