[justfile]
default_recipe_marker = "just --list"
required = [
    { recipe = "default" },
    { recipe = "install", alias = "i" },
    { recipe = "knip", alias = "k" },
    { recipe = "typecheck", alias = "tc" },
    { recipe = "lint", alias = "l" },
    { recipe = "test", alias = "t" },
    { recipe = "check", alias = "c" },
    { recipe = "push", alias = "p" },
    { recipe = "push-ready", alias = "pr" },
]
recommended = [
    { recipe = "upgrade", alias = "u" },
    { recipe = "upgrade-interactive", alias = "ui" },
    { recipe = "clean" },
]
check_pipeline = ["install", "knip", "typecheck", "lint", "test"]
wrapped_tools = [
    "ruff",
    "pyrefly",
    "pytest",
    "rumdl",
    "vulture",
    "cerberus",
    "eslint",
    "prettier",
    "knip",
    "tsc",
]

[ci_workflow_gate]

[ci_check_sequence]

[ci_check_sequence.required]
ts = [
    "pnpm install --frozen-lockfile",
    "pnpm run knip",
    "pnpm run typecheck",
    "pnpm run lint",
    "prettier --check",
    "pnpm run test",
]
python = [
    "uv sync --locked",
    "vulture",
    "rumdl check",
    "ruff check",
    "ruff format --check",
    "pyrefly check",
    "pytest",
]

[ci_cerberus_step]

[workflow_toolchain_only]
allowed_setup_actions = [
    "astral-sh/setup-uv",
    "pnpm/action-setup",
    "actions/setup-node",
]

[source]
production_roots = ["apps/*", "packages/*", "infra"]
test_files = [
    "**/tests/**",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test_*.py",
    "**/*_test.py",
    "**/conftest.py",
]

[pyrefly]
error_kinds = [
    "implicit-any",
    "implicit-any-parameter",
    "implicit-any-type-argument",
    "implicit-any-attribute",
    "implicit-any-empty-container",
    "explicit-any",
    "unannotated-return",
    "missing-override-decorator",
    "potential-bad-keyword-argument",
    "unused-ignore",
]

[ruff]
sanctioned_ignore = [
    "COM812",
    "ISC001",
    "D",
    "DOC",
    "CPY001",
    "S404",
    "S603",
    "S606",
    "S607",
]
sanctioned_test_ignore = ["ANN001", "INP001", "S101"]

[line_length]
width = 120

[rumdl]
canonical = '''
[global]
disable = [
    "MD013", # line-length
    "MD022", # blanks-around-headings
    "MD031", # blanks-around-fences
    "MD032", # blanks-around-lists
    "MD033", # no-inline-html
]

# no-duplicate-heading
[MD024]
siblings-only = true
'''

[knip]
prod_allowed_exclude = ["catalog"]

[knip.allowed_customizations]
ignoreBinaries = ["podman", "uv"]
ignoreDependencies = ["cloudflare"]

[vitest]
min_coverage = 90

[tsc]

[catalog_pinned_deps]

[story_tests_lockstep_py]

[story_tests_lockstep_ts]

[cli_ts_test_seam]

[lib_ts_test_seam]

[fixture_roles_ts]

[cli_py_test_seam]

[lib_py_test_seam]

[release_surface_version_bump]

[codeowners_coverage]

[pytest]
min_coverage = 90

[jscpd]
threshold = 0.1
pattern = "**/*.{ts,tsx,py}"
ignore = ["**/dist/**", "**/.venv/**", "**/*.gen.*"]

[fallow]

[zyplux_deps_latest]

# Only the repo carrying the pin source can act on a lagging pin; it switches this on in its overlay.
[tool_pins_latest]
off = true
