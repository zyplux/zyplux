preset = "strict"
min-severity = "warn"

project-includes = [
    "apps/airlock/src",
    "apps/cerberus/src",
    "apps/clipy/src",
    "apps/action-setup-pm/src",
    "apps/action-config-to-kv/src",
    "apps/totchef",
    "apps/token_stats/src",
    "docs",
    "tests",
]
# gitignored .claude/worktrees/ makes pyrefly's exclude-heuristics treat an agent worktree as fully excluded — trust project-includes literally instead.
disable-project-excludes-heuristics = true
project-excludes = ["**/node_modules"]
use-ignore-files = false
search-path = [
    "apps/airlock/src",
    "tests/release_fixtures",
    "apps/action-setup-pm/src",
    "apps/action-config-to-kv/src",
    "apps/cerberus/src",
    "apps/clipy/src",
    "apps/totchef/src",
    "apps/token_stats/src",
    "tests/cerberus",
    "tests/clipy",
    "tests/totchef/project",
    "tests/totchef",
    "tests/token_stats",
]
