[project]
name = "zyplux"
version = "0"
description = "zyplux — virtual workspace root (cerberus governance CLI + @zyplux/eslint-config)"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/airlock",
    "apps/cerberus",
    "apps/clipy",
    "apps/action-setup-pm",
    "apps/totchef",
    "apps/token_stats",
]

[tool.uv.sources]
zyplux-airlock = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["tests/release_fixtures"]
addopts = "-n auto --cov=airlock --cov=cerberus --cov=clipy --cov=setup_pm --cov=totchef --cov=token_stats --cov-report=term-missing --durations=20"
testpaths = [
    "tests/airlock",
    "tests/cerberus",
    "tests/clipy",
    "tests/setup_pm",
    "tests/totchef",
    "tests/token_stats",
]

[tool.coverage.run]
data_file = "coverage/.coverage"
patch = ["subprocess"]
# Local convenience tool, maintained through linting and typechecking.
omit = ["apps/clipy/src/clipy/justpty.py"]

[tool.coverage.report]
fail_under = 90

[tool.vulture]
paths = [
    "apps/airlock/src",
    "apps/cerberus/src",
    "apps/clipy/src",
    "apps/action-setup-pm/src",
    "apps/totchef/src",
    "apps/token_stats/src",
    "tests/airlock",
    "tests/cerberus",
    "tests/clipy",
    "tests/release_fixtures",
    "tests/setup_pm",
    "tests/totchef",
    "tests/token_stats",
]
ignore_decorators = ["@app.command", "@app.callback", "@model_validator"]
# Cooks are resolved by entry point / config-dir convention (totchef.registry), so vulture
# sees no static reference and reports every cook class as dead — they're totchef's plugins,
# not dead code. `model_config` is read by pydantic's model metaclass, never called by name.
ignore_names = [
    "pytestmark",
    "*Cook",
    "model_config",
    "_fake_tokenizer_backend",
]

[dependency-groups]
lint = ["ruff>=0.17.3", "rumdl>=0.3.1", "vulture>=2.16"]
test = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "tomli-w>=1.2.0",
]
type = [
    "pyrefly>=1.4.0",
    "types-networkx>=3.6.1.20261024",
    "types-pyyaml>=6.0.12.20260906",
    # psutil ships no type stubs of its own; apps/clipy's ctop.py needs this to resolve them.
    "types-psutil>=7.2.2.20260906",
    "types-docker>=7.2.0.20261006",
]
